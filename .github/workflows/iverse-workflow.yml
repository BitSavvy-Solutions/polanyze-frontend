name: Deploy Polanyze to cPanel

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'npm'
          
      - name: Install dependencies
        # working-directory: ./polanyze-frontend # Uncomment if needed
        run: npm ci
        
      - name: Build Vite App
        # working-directory: ./polanyze-frontend # Uncomment if needed
        run: npm run build
        
      - name: Deploy to cPanel via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.CPANEL_USERNAME }}
          server: ${{ secrets.CPANEL_HOST }}
          

          
          # ⚠️ CHANGE 2: Swapped 'password' for 'ssh_private_key'
          # Make sure you added your new private key content to this Secret in GitHub
          ssh_private_key: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          
          # Vite builds to 'dist' by default
          local_path: './dist/*' 
          
          # Your specific folder path secret
          remote_path: ${{ secrets.POLANYZE_REMOTE_PATH }}
          
          sftp_only: true
